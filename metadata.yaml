name: astrbot_plugin_soutu_search
display_name: 搜图 (搜本 / 搜图 / 搜P站)
desc: >
  为 AstrBot 提供三条**互斥**搜图指令：「搜本」（别名 搜本子/soutu/找图）以图搜本子，
  对接 soutubot.moe，**只接受图片**；「搜图」只用 `搜图 <关键词>` 做关键词搜图，
  对接 Safebooru，**只接受关键词**；「搜P站」（别名 pixiv/saucenao）反查图片出处/画师，
  对接 SauceNAO，默认仅检索 Pixiv 库。
  支持结果 TTL 缓存，命令前缀跟随 AstrBot 全局配置（wake_prefix）。
  仅通过指令触发（不监听消息、不自动搜图），并默认采用「只回文字与来源链接」的安全策略
  （缩略图默认关闭，避免风控）。
version: 0.4.0
author: Shawlei
astrbot_version: ">=4.26.0,<5"
repo: https://github.com/Shawlei/astrbot_plugin_soutu_search
short_desc: 搜本（soutubot 以图搜本子）+ 搜图（Safebooru 关键词）+ 搜P站（SauceNAO 反查 Pixiv）
